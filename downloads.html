    <!-- 下载选项模态框 -->
    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalFileName">文件下载</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>请选择下载方式：</p>
                <div class="download-options" id="downloadOptions">
                    <!-- 下载选项将通过JavaScript动态生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-close-btn" onclick="closeModal()">关闭</button>
            </div>
        </div>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <script src="/main.js"></script>
    <script>
        // 页面加载完成后加载资源
        document.addEventListener('DOMContentLoaded', function() {
            loadResources();
        });

        // 从JSON配置文件加载资源
        function loadResources() {
            const loadingEl = document.getElementById('resourcesLoading');
            const skeletonEl = document.getElementById('skeletonContainer');
            
            // 显示骨架屏
            setTimeout(() => {
                if (loadingEl) loadingEl.style.display = 'none';
                if (skeletonEl) skeletonEl.style.display = 'block';
            }, 300);
            
            fetch('/data/downloads-config.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    // 延迟显示内容，让骨架屏动画有足够时间展示
                    setTimeout(() => {
                        if (skeletonEl) skeletonEl.style.display = 'none';
                        renderResources(data.folders);
                    }, 500);
                })
                .catch(error => {
                    console.error('加载资源失败:', error);
                    if (skeletonEl) skeletonEl.style.display = 'none';
                    document.getElementById('fileSystemRoot').innerHTML = '<div class="error">加载资源失败，请检查配置文件</div>';
                });
        }

        // 渲染资源
        function renderResources(folders) {
            const root = document.getElementById('fileSystemRoot');
            root.innerHTML = '';

            folders.forEach((folder, index) => {
                const folderElement = document.createElement('div');
                folderElement.className = 'folder-item';
                
                const folderHeader = document.createElement('div');
                folderHeader.className = 'folder-header';
                folderHeader.onclick = function() { toggleFolder(this); };
                
                const folderIcon = document.createElement('i');
                folderIcon.className = index === 0 ? 'fas fa-folder-open' : 'fas fa-folder';
                
                const folderName = document.createElement('span');
                folderName.className = 'folder-name';
                folderName.textContent = folder.name;
                
                const folderSize = document.createElement('span');
                folderSize.className = 'folder-size';
                folderSize.textContent = `${folder.files.length}个文件`;
                
                folderHeader.appendChild(folderIcon);
                folderHeader.appendChild(folderName);
                folderHeader.appendChild(folderSize);
                
                const folderContent = document.createElement('div');
                folderContent.className = 'folder-content';
                if (index !== 0) {
                    folderContent.style.display = 'none';
                }
                
                // 添加文件
                folder.files.forEach(file => {
                    const fileElement = document.createElement('div');
                    fileElement.className = 'file-item';
                    
                    const fileIcon = document.createElement('i');
                    fileIcon.className = file.type === 'pdf' ? 'fas fa-file-pdf' : 'fas fa-file';
                    
                    const fileName = document.createElement('span');
                    fileName.className = 'file-name';
                    fileName.textContent = file.name;
                    
                    const fileSize = document.createElement('span');
                    fileSize.className = 'file-size';
                    fileSize.textContent = file.size;
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = '#';
                    downloadLink.className = 'download-link';
                    downloadLink.onclick = function() {
                        showDownloadOptions(file);
                    };
                    
                    const downloadIcon = document.createElement('i');
                    downloadIcon.className = 'fas fa-download';
                    
                    const downloadText = document.createTextNode(' 下载');
                    
                    downloadLink.appendChild(downloadIcon);
                    downloadLink.appendChild(downloadText);
                    
                    fileElement.appendChild(fileIcon);
                    fileElement.appendChild(fileName);
                    fileElement.appendChild(fileSize);
                    fileElement.appendChild(downloadLink);
                    
                    folderContent.appendChild(fileElement);
                });
                
                folderElement.appendChild(folderHeader);
                folderElement.appendChild(folderContent);
                
                root.appendChild(folderElement);
            });
        }

        // 文件夹展开/收起功能
        function toggleFolder(element) {
            const folderContent = element.nextElementSibling;
            const folderIcon = element.querySelector('i');
            
            if (folderContent.style.display === 'none') {
                folderContent.style.display = 'block';
                folderIcon.className = 'fas fa-folder-open';
            } else {
                folderContent.style.display = 'none';
                folderIcon.className = 'fas fa-folder';
            }
        }

        // 显示下载选项模态框
        function showDownloadOptions(file) {
            document.getElementById('modalFileName').textContent = file.name;
            const downloadOptions = document.getElementById('downloadOptions');
            downloadOptions.innerHTML = '';
            
            // 添加百度网盘链接
            if (file.baidu) {
                const baiduOption = document.createElement('a');
                baiduOption.href = file.baidu;
                baiduOption.className = 'download-option';
                baiduOption.target = '_blank';
                baiduOption.innerHTML = '<i class="fas fa-cloud"></i><span>百度网盘</span>';
                downloadOptions.appendChild(baiduOption);
            }
            
            // 添加夸克网盘链接
            if (file.quark) {
                const quarkOption = document.createElement('a');
                quarkOption.href = file.quark;
                quarkOption.className = 'download-option';
                quarkOption.target = '_blank';
                quarkOption.innerHTML = '<i class="fas fa-cloud-download-alt"></i><span>夸克网盘</span>';
                downloadOptions.appendChild(quarkOption);
            }
            
            document.getElementById('downloadModal').style.display = 'block';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('downloadModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('downloadModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
