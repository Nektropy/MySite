    <script>
        // 页面加载完成后加载站点
        document.addEventListener('DOMContentLoaded', function() {
            loadWebsites();
        });

        // 从JSON配置文件加载站点
        function loadWebsites() {
            fetch('data/websites-config.json')
                .then(response => response.json())
                .then(data => {
                    renderWebsites(data.categories);
                })
                .catch(error => {
                    console.error('加载站点失败:', error);
                    document.getElementById('websitesContainer').innerHTML = '<div class="error">加载站点失败，请检查配置文件</div>';
                });
        }

        // 渲染站点
        function renderWebsites(categories) {
            const container = document.getElementById('websitesContainer');
            container.innerHTML = '';

            categories.forEach(category => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const cardTitle = document.createElement('h3');
                cardTitle.className = 'card-title';
                
                const icon = document.createElement('i');
                icon.className = category.icon;
                
                const titleText = document.createTextNode(' ' + category.name);
                
                cardTitle.appendChild(icon);
                cardTitle.appendChild(titleText);
                
                const websitesList = document.createElement('div');
                websitesList.className = 'websites-list';
                
                category.websites.forEach(website => {
                    const websiteItem = document.createElement('a');
                    websiteItem.href = website.url;
                    websiteItem.target = '_blank';
                    websiteItem.className = 'website-item';
                    
                    const websiteIcon = document.createElement('div');
                    websiteIcon.className = 'website-icon';
                    
                    const favicon = document.createElement('img');
                    favicon.src = website.favicon;
                    favicon.alt = website.name;
                    
                    websiteIcon.appendChild(favicon);
                    
                    const websiteInfo = document.createElement('div');
                    websiteInfo.className = 'website-info';
                    
                    const websiteName = document.createElement('h4');
                    websiteName.textContent = website.name;
                    
                    const websiteDesc = document.createElement('p');
                    websiteDesc.textContent = website.description;
                    
                    websiteInfo.appendChild(websiteName);
                    websiteInfo.appendChild(websiteDesc);
                    
                    websiteItem.appendChild(websiteIcon);
                    websiteItem.appendChild(websiteInfo);
                    
                    websitesList.appendChild(websiteItem);
                });
                
                card.appendChild(cardTitle);
                card.appendChild(websitesList);
                
                container.appendChild(card);
            });
        }
    </script>
